<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitcoin self-custody simulator</title>
<style>
:root{
  --bg:#ECEEFF; --surface:#FFFFFF; --soft:#F4F5FF; --ink:#1B1840; --muted:#5A5688; --line:#D6D8F4;
  --primary:#5438F0; --on-primary:#FFFFFF; --base-bar:#A7A4CB;
  --k0:#FFB81F; --k1:#FF6B93; --k2:#19C29D; --k3:#9A82FF; --k4:#45A9FF; --tok-ink:#1B1840;
  --low:#17A865; --yel:#E0B400; --mid:#F07F00; --high:#EF5350; --shade:#000;
  --sky:#8CCBFF; --sky2:#D4EEFF; --sun:#FFB81F; --cloud:#FFFFFF; --cloud2:#DDEEFF; --g1:#C6F06A; --g2:#3CC98C; --road1:#55507F; --road2:#2B2850; --bush:#2FA364; --bush2:#5CC66C; --bush3:#7FD877; --sea1:#56B6F0; --sea2:#C2E8FF; --wood:#C98A4B; --wood2:#9A6A3A; --bird:#3B4C7A; --night:0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131129; --surface:#1E1B42; --soft:#28245A; --ink:#F1EFFF; --muted:#ACA8D8; --line:#37327A;
    --primary:#9C8AFF; --on-primary:#131129; --base-bar:#625E96;
    --low:#3DDC84; --yel:#FFE066; --mid:#FFA23D; --high:#FF6B6B; --shade:#fff;
    --sky:#0C1030; --sky2:#1B2560; --sun:#EDEBFF; --cloud:#2C3478; --cloud2:#242B66; --g1:#1C8663; --g2:#0A4F44; --road1:#25224F; --road2:#0C0B22; --bush:#083F37; --bush2:#0D5647; --bush3:#136A56; --sea1:#16307A; --sea2:#1C3F8C; --wood:#5B4636; --wood2:#3E3026; --bird:#8E9AD0; --night:1;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131129; --surface:#1E1B42; --soft:#28245A; --ink:#F1EFFF; --muted:#ACA8D8; --line:#37327A;
  --primary:#9C8AFF; --on-primary:#131129; --base-bar:#625E96;
  --low:#3DDC84; --yel:#FFE066; --mid:#FFA23D; --high:#FF6B6B; --shade:#fff;
  --sky:#0C1030; --sky2:#1B2560; --sun:#EDEBFF; --cloud:#2C3478; --cloud2:#242B66; --g1:#1C8663; --g2:#0A4F44; --road1:#25224F; --road2:#0C0B22; --bush:#083F37; --bush2:#0D5647; --bush3:#136A56; --sea1:#16307A; --sea2:#1C3F8C; --wood:#5B4636; --wood2:#3E3026; --bird:#8E9AD0; --night:1;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em;max-width:14ch}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.wrap{max-width:1080px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.brand{font-family:var(--display);font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.brand i{display:flex}
.brand i b{width:14px;height:14px;border-radius:50%;margin-left:-5px;border:2px solid var(--bg)}
.brand i b:first-child{margin-left:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;padding:0;margin:0;list-style:none}
.steps button{border:0;background:transparent;padding:6px 12px;border-radius:99px;cursor:pointer;font-weight:600;color:var(--muted)}
.steps button[aria-current="step"]{background:var(--ink);color:var(--bg)}
.steps button:disabled{opacity:.45;cursor:default}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.grid.solo{grid-template-columns:minmax(0,1fr)}.grid.solo .score{display:none}
.stage{display:grid;gap:18px;min-width:0}
.stage>*{min-width:0}
.lede{color:var(--muted);font-size:1.1rem;max-width:46ch}
.card{background:var(--surface);border-radius:20px;padding:18px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:16px;padding:5px 12px;font-size:.9rem;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.rowb{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:14px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--primary);color:var(--on-primary)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.small{padding:7px 13px;border-radius:10px;font-weight:600}
.btn:disabled{opacity:.4;cursor:default}
.hint{color:var(--muted);font-size:.9rem}

/* scoreboard */
.score{background:var(--surface);border-radius:20px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:14px;z-index:5}
.score h2{font-size:1.1rem}
.meters{display:grid;gap:12px}
.meter .name{font-weight:700;margin-bottom:4px}
.bar{display:grid;grid-template-columns:54px 1fr 30px;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin:3px 0}
.bar .track{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar .fill{display:block;height:100%;border-radius:99px;background:var(--base-bar);transition:width .35s ease}
.bar.you{color:var(--ink);font-weight:700}
.bar .num{text-align:right;font-variant-numeric:tabular-nums}
.lv-low{background:var(--low)!important}.lv-mid{background:var(--mid)!important}.lv-high{background:var(--high)!important}
.worry{font-size:.82rem;color:var(--muted);margin-top:2px}
.dots{letter-spacing:2px}
.effort{display:grid;grid-template-columns:54px 1fr;gap:2px 8px;font-size:.85rem;color:var(--muted)}
.effort .name{grid-column:1/-1;font-weight:700;color:var(--ink);font-size:1rem;margin-bottom:2px}
.effort .you{color:var(--ink);font-weight:700}

/* setup card and button levels */
.setuphead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.spec{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;margin:0}
.spec dt{color:var(--muted);font-size:.9rem;padding-top:1px}
.spec dd{margin:0;font-weight:600}
.link{background:none;border:0;padding:2px 0;color:var(--primary);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;flex:none}
.btn.outline{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 2px var(--primary)}
/* summary */
.warnpill{background:color-mix(in srgb,var(--mid) 28%,var(--surface));font-weight:600}
.motto{background:var(--surface);border-radius:16px;padding:12px 16px;max-width:48ch;font-weight:600}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
.sumgrid h4{margin:0 0 6px;font-size:.9rem;font-family:var(--body);color:var(--muted)}
.sumgrid ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.sumgrid li{padding-left:22px;position:relative}
.sumgrid li::before{position:absolute;left:0;font-weight:800}
.sumgrid .pro li::before{content:"\2713";color:var(--low)}
.sumgrid .con li::before{content:"!";left:5px;color:var(--high)}
.tip{background:var(--soft);border-radius:14px;padding:10px 14px;margin-top:10px}
.tip b{display:block;font-size:.9rem;color:var(--muted)}
.tip .do{display:block;font-weight:700}
.tip .why{display:block;margin-top:2px}
/* how it works */
.info{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--display);font-weight:800;cursor:pointer;line-height:1}
dialog{border:0;border-radius:22px;padding:0;background:var(--surface);color:var(--ink);width:min(580px,calc(100vw - 24px));max-height:min(88vh,780px)}
dialog::backdrop{background:rgba(20,18,48,.55)}
.simbody{padding:18px;display:grid;gap:12px}
#edit{background:var(--bg)} /* the form is made of white cards, so the dialog behind them is tinted */
.simbody h4{margin:6px 0 -4px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.simhead{display:flex;align-items:center;gap:10px}.simhead .emo{font-size:1.6rem}.simhead h3{flex:1;font-size:1.15rem}
.simx{border:0;background:var(--soft);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:1.3rem;line-height:1;cursor:pointer}
.dsurprise{font-size:1.05rem;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.dsurprise:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.dtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dtile{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;text-align:left;border:0;border-radius:14px;padding:10px 12px;background:var(--soft);color:var(--ink);font-size:.86rem;font-weight:600;line-height:1.25;cursor:pointer;transition:transform .1s,background .1s}
.dtile span{font-size:1.5rem}
.dtile:hover{background:var(--line);transform:translateY(-1px)}
.how{padding:20px;display:grid;gap:14px}
.howhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.howhead h2{font-size:1.3rem}
.x{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:1.2rem;cursor:pointer;flex:none}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:9px;padding:6px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.how h3{font-size:1rem;margin-bottom:4px}
.defs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 8px}
.defs div{background:var(--soft);border-radius:12px;padding:10px 12px}
.defs b{display:block;margin-bottom:2px}
@media (max-width:520px){.defs{grid-template-columns:1fr}}
.plain{margin:0;padding-left:20px;display:grid;gap:4px}
.drv{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.drv li{background:var(--soft);border-radius:12px;padding:8px 12px}
.drv small,.piece small{display:block;color:var(--muted);font-size:.82rem}
.piece{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.piece .ds{display:flex;gap:6px;flex:none}
.delta{position:relative;border:0;cursor:help;color:inherit;font:inherit;white-space:nowrap;font-weight:700;font-size:.82rem;border-radius:99px;padding:3px 9px;background:var(--soft);font-variant-numeric:tabular-nums}
.delta::after{content:attr(data-tip);position:absolute;right:0;bottom:calc(100% + 8px);width:max-content;max-width:260px;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:10px;font-weight:400;font-size:.82rem;line-height:1.35;white-space:normal;text-align:left;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s;z-index:5}
.delta:hover::after,.delta:focus::after{opacity:1;visibility:visible}
.delta.up{background:color-mix(in srgb,var(--high) 26%,var(--surface))}
.delta.down{background:color-mix(in srgb,var(--low) 26%,var(--surface))}
@media (max-width:520px){.piece{flex-direction:column;align-items:flex-start}.delta::after{right:auto;left:0;bottom:auto;top:calc(100% + 8px);max-width:min(220px,54vw)}}
/* editor */
.quorum{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.stepper{display:inline-flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:6px 8px;font-weight:600}
.stepper button{width:32px;height:32px;border-radius:10px;border:0;background:var(--surface);cursor:pointer;font-weight:700;font-size:1.1rem}
.stepper button:disabled{opacity:.35;cursor:default}
.stepper output{min-width:1.5ch;text-align:center;font-family:var(--display);font-size:1.3rem;font-weight:800}
.keys{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border:0;border-radius:10px;padding:7px 13px;font-weight:600;cursor:pointer;background:var(--soft);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.krow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;border-left:6px solid var(--kc)}
.krow .ktxt{display:grid;min-width:0;flex:1}
.krow small{color:var(--muted)}
.adv>summary{font-weight:700;color:var(--ink);font-size:1rem;padding:4px 2px}
.adv>*+*{margin-top:10px}
.key{max-width:560px;background:var(--surface);border-radius:18px;padding:14px;border-top:6px solid var(--kc);display:grid;gap:10px}
.key header{display:flex;align-items:center;gap:8px}
.tok{width:30px;height:30px;border-radius:50%;background:var(--kc);color:var(--tok-ink);display:inline-grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.key>*{min-width:0}
.fields label{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;font-size:.8rem;color:var(--muted);min-width:0}
.fields label.wide{grid-column:1/-1}
select{width:100%;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.95rem}
details summary{cursor:pointer;font-size:.9rem;font-weight:600;color:var(--muted)}
details .fields{margin-top:8px}

/* use it */
.receipt{background:color-mix(in srgb,var(--low) 22%,var(--surface));border-radius:14px;padding:10px 14px;font-weight:600}
.die{font-size:2.2rem;line-height:1;display:inline-block;animation:roll .45s linear infinite}
@keyframes roll{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(90deg) translateY(-6px)}50%{transform:rotate(180deg) translateY(0)}75%{transform:rotate(270deg) translateY(-6px)}100%{transform:rotate(360deg) translateY(0)}}
/* disaster */
.dcmp{display:grid;gap:10px;margin-top:10px}
.dres{border-radius:16px;padding:14px}
.dres.bad{background:color-mix(in srgb,var(--high) 16%,var(--surface))}
.dres.ok{background:color-mix(in srgb,var(--low) 18%,var(--surface))}
.dres .emo{font-size:2rem;line-height:1}
.dres .body{display:grid;gap:8px;justify-items:start}
.dkeys[hidden]{display:none}
.card>.chips:first-child{margin-top:0}
.dkeys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.9rem}
.dk{display:inline-flex;align-items:center;gap:6px}
.dk .tok{width:22px;height:22px;font-size:.75rem}
.dk.hit .tok{opacity:.35}

/* stress matrix */
.mx{display:grid;gap:6px}
.mx .head,.mx .ev{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.mx .head{font-size:.85rem;color:var(--muted);font-weight:600;padding:0 12px}
.mx .ev{background:var(--surface);border-radius:14px;padding:10px 12px}
.mx .group{font-family:var(--display);font-weight:800;margin-top:10px}
.cell small{display:block;color:var(--muted);font-size:.8rem}
.st{display:inline-block;border-radius:99px;padding:2px 10px;font-weight:700;font-size:.85rem;color:var(--tok-ink)}
.conf{display:flex;gap:6px;flex-wrap:wrap}
.conf button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.conf button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
#fb{min-height:120px}
textarea{width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px;min-height:70px;resize:vertical}
footer{margin:28px 0 12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.foot2{flex-basis:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:16px} /* last line: the warning, and the GitHub mark in the bottom right corner */
.gh{flex:none;display:inline-flex;color:inherit;opacity:.75;transition:opacity .12s,transform .12s}
.gh:hover{opacity:1;transform:scale(1.1)}
.gh svg{width:26px;height:26px;fill:currentColor;display:block}
footer button,footer a{background:none;border:0;text-decoration:underline;cursor:pointer;color:inherit;padding:0}

@media (max-width:820px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .steps{gap:2px}.steps button{padding:5px 8px;font-size:.85rem}.steps .no{display:none}
  .score{order:-1;padding:12px;gap:8px;top:env(safe-area-inset-top,0px);border-radius:0 0 18px 18px;margin:0 -16px;box-shadow:0 6px 0 var(--bg)}
  .score h2,.score .worry,.score .effort,.score .note{display:none}
  .info{top:6px;right:8px;width:24px;height:24px;font-size:.8rem}
  footer #reset{order:3}footer .foot2{order:4} /* the line with the GitHub mark stays last, so the mark keeps the corner */
  .sumgrid{grid-template-columns:1fr}
  .score .meters{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .bar{grid-template-columns:44px 1fr 24px;gap:5px}
  .mx .head{display:none}
  .mx .ev{grid-template-columns:1fr 1fr}
  .mx .ev .what{grid-column:1/-1;font-weight:700}
  .cell::before{content:attr(data-who);display:block;font-size:.75rem;color:var(--muted)}
}
@media (max-width:380px){.key select{padding:8px 6px;font-size:.86rem}.key{padding:12px}}
/* ---------- map of a setup, see map.js ---------- */
/* On the Today screen the map fills everything between the header and the footer, edge to edge. The sea is the
   card's own background, so it carries on past the drawing on screens that are wider or taller than the picture. */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
body.mapscreen{overflow-x:clip;background:linear-gradient(#7EC8FF,#4FA9EE) no-repeat #4FA9EE} /* the sea is the whole page, behind the header and footer too */
body.mapscreen::before{background:#7EC8FF}
/* the sea is the same in light and dark themes, so the text on it is always dark */
.mapscreen .brand,.mapscreen footer,.mapscreen .steps button:not([aria-current]){color:#1B1840}
.mapscreen .steps button[aria-current]{background:#1B1840;color:#fff}
.mapscreen .brand i b{border-color:#7EC8FF}
.mapscreen .wrap{min-height:100svh;display:flex;flex-direction:column}
.mapscreen .grid{flex:1;display:flex;align-items:stretch}.mapscreen .score{display:none}
.mapscreen .stage{flex:1;display:flex;flex-direction:column}
.mapscreen footer{display:none} /* the map fills this screen; the footer is on the first screen and the later ones */
.mapscreen .wrap{padding-bottom:0}
.mapcard{position:relative;flex:1;min-height:440px;width:100vw;margin:0 0 0 calc(50% - 50vw);overflow:hidden}
.map{position:absolute;inset:8px 0 64px;width:100%;height:calc(100% - 72px);display:block}
/* the same two risks inside the edit dialog, above "Done": they change as you edit, and open the scoreboard */
.riskline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:center;min-height:44px;padding:6px 16px;border-radius:22px;border:2px solid var(--line,#D9D6EE);background:var(--soft);color:inherit;font:inherit;font-size:.9rem;cursor:pointer}
.riskline span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.riskline i{width:12px;height:12px;border-radius:50%}
@media (max-width:760px){
  .mapcard{min-height:520px}
  .map{inset:4px 0 132px;height:calc(100% - 136px)}
}
/* the full scoreboard inside its dialog: undo the sticky side panel and the narrow-screen summary */
.scorefull.score{position:static;order:0;margin:0;padding:0;border-radius:0;box-shadow:none;background:none;display:grid;gap:14px}
.scorefull.score h2,.scorefull .info{display:none} /* the dialog has its own title, and "See more details" replaces the i button */
.scoremore .how{padding:0}.scoremore .howhead .x,.scoremore .seg{display:none}
.scoremore{border-top:2px solid var(--line);padding-top:14px}
.scorefull.score .worry,.scorefull.score .note{display:block}.scorefull.score .effort{display:grid}
.scorefull.score .meters{display:grid;grid-template-columns:1fr;gap:14px}
/* the last screen: one big button to pass the game on */
.finish{display:grid;gap:18px;justify-items:center;text-align:center;max-width:560px;margin:6vh auto 0}
.finish .share{display:grid;gap:14px;justify-items:center;width:100%;padding:28px 20px}
.finish .rowb{justify-content:center}
.share a{color:var(--primary);font-weight:700;overflow-wrap:anywhere}
.map text{font-family:var(--body);fill:#1B1840}
.maptap{cursor:pointer}
.mapplace{transition:filter .15s}.mapplace:hover{filter:brightness(1.07)} /* buildings, the cloud and the company: clickable, for a name and a joke */
.mappulse{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion:no-preference){.mappulse{animation:mappulse 2.4s ease-in-out var(--t,0s) infinite}}
@keyframes mappulse{0%,60%,100%{transform:scale(1)}30%{transform:scale(1.12)}}
.maptools{position:absolute;bottom:14px;right:12px;display:flex;gap:10px} /* bottom right is open sea on every map */
.maptool{min-width:48px;height:48px;padding:0 9px;border-radius:24px;border:3px solid #1B1840;background:#fff;color:#1B1840;box-shadow:0 4px 0 #1B1840;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.92rem;line-height:1;cursor:pointer;transition:transform .12s,box-shadow .12s}
.maptool span{font-size:1.3rem}
.maptool span+*,.maptool span:not(:only-child){margin-right:0}
/* the introduction: everything starts hidden and arrives beat by beat, see runMapIntro() in ui.js */
.mapstep{transform-box:fill-box;transform-origin:50% 100%}
.mapintro .map>*{pointer-events:none} /* the things on the map can't be used until they arrive; the map itself still takes drags and pinches */
.mapintro .maptap:has(.in),.mapintro .maptap.in{pointer-events:auto} /* a thing can be opened as soon as it has arrived */
.mapintro .mapplace{pointer-events:auto} /* the places are there from the start, so they open their cards from the start. A click on one must not fall through to the map and continue the introduction */
.mapintro .mapstep,.mapintro .maptool{opacity:0}
.mapintro .maptool.in{opacity:1}
.mapintro .maptools{pointer-events:none} /* buttons not yet introduced must not catch the click that continues the introduction */
.mapintro .maptool.in{pointer-events:auto} /* once its caption has introduced it, a button works */
body:has(dialog[open]) .mapcap,body:has(dialog[open]) .mapline,.mapcard:has(.mapresult) .mapcap,.mapcard:has(.mapresult) .mapline{visibility:hidden} /* a dialog, or a disaster playing on the map, has the player's full attention */
.mapline{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2} /* above the buttons: on a phone the arrow to the lower row crosses the upper one */
/* the pen arrow itself is styled with the landing's, under .pen: the line draws itself, then the head */
.mapline .pen{animation:sc-draw .32s ease-out both}.mapline .pen.head{animation:sc-head .16s ease-out .3s both}
.mapintro .mapstep.in{opacity:1;animation:mapin .5s both}
.mapintro .mapstep.in.was{animation:none} /* already there before a redraw: no second entrance */
.mapcap{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 24px);background:#1B1840;color:#fff;font-family:var(--display);font-weight:700;font-size:1.15rem;padding:10px 18px;border-radius:16px;border:0;text-align:center;opacity:0;cursor:pointer}
.mapintro{cursor:pointer}
/* the caption is a bar: back arrow (from the second step on), the words, and the arrow that continues */
.mapcap{display:flex;align-items:center;justify-content:center;gap:8px}
.mapcap button{flex:none;border:0;background:none;font:inherit;line-height:1;cursor:pointer;padding:6px 8px;border-radius:10px}
.mapcap button:hover{background:rgb(255 255 255/.14)}
.mapnext{color:#FFD84D}.mapback{color:#fff;opacity:.75}
@media (prefers-reduced-motion:no-preference){.mapnext{animation:mapnudge .9s ease-in-out infinite}}
@keyframes mapnudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.mapcap.in{opacity:1;animation:mapcap .35s both}
.mapcap.up{bottom:112px}
/* the way forward is filled in and set a little apart from the two things to do on this screen */
.maptool.next{background:var(--primary);color:var(--on-primary);padding:0 16px;margin-left:8px}
@media (max-width:760px){ /* phones, Today: Edit is a round icon in the top right corner; at the bottom, "Try a disaster" beside the way forward */
  .maptools{position:static} /* so each button places itself on the map card */
  .maptool{position:absolute;font-size:.86rem}
  .maptool[data-act="simBase"],.maptool.next{bottom:14px;width:calc(50% - 14px);margin:0;padding:0 8px}
  .maptool[data-act="simBase"]{left:10px}.maptool.next{right:10px}
  .maptool[data-act="editBase"]{right:10px;top:10px;width:48px;padding:0;gap:0;font-size:0} /* the icon alone; the name is still its label */
  .map{inset:4px 0 76px;height:calc(100% - 80px)}
  .mapcard{min-height:520px}
  .mapcap{bottom:14px;font-size:1rem;width:calc(100% - 24px)}
  .mapcap.up{bottom:102px}
  /* phones, Build: the two ways to build are the bottom row, labelled. Once there is a way forward (.fwd) it takes the
     bottom row to itself and they move up one. "Try a disaster" is the round icon in the corner here. */
  .mapcard.build .maptool[data-act="suggest"],.mapcard.build .maptool[data-act="editBase"]{top:auto;bottom:14px;width:calc(50% - 14px);padding:0 8px;gap:6px;font-size:.86rem}
  .mapcard.build .maptool[data-act="suggest"]{left:10px}.mapcard.build .maptool[data-act="editBase"]{right:10px}
  .mapcard.build.fwd .maptool[data-act="suggest"],.mapcard.build.fwd .maptool[data-act="editBase"]{bottom:72px}
  .mapcard.build .maptool.next{left:10px;right:10px;width:auto}
  .mapcard.build .maptool[data-act="simBase"]{left:auto;right:10px;top:10px;bottom:auto;width:48px;padding:0;gap:0;font-size:0}
  .mapcard.build.fwd .map{inset:4px 0 134px;height:calc(100% - 138px)}
}
@keyframes mapin{0%{opacity:0;transform:translateY(-34px) scale(.6)}60%{opacity:1;transform:translateY(3px) scale(1.06)}100%{opacity:1;transform:none}}
@keyframes mapcap{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%)}}
/* "Use it": the new setup's map with two balance pills at the top and one card that says what to do next (see screenUse).
   There are no buttons under the map here, so it runs to the bottom. */
.mapcard.use .map{inset:8px 0 16px;height:calc(100% - 24px)}
.usehud{position:absolute;left:14px;top:10px;display:flex;align-items:center;gap:8px;pointer-events:none}
.usebal{display:grid;gap:1px;min-width:118px;background:#fff;color:#1B1840;border:3px solid #1B1840;border-radius:16px;box-shadow:0 4px 0 #1B1840;padding:6px 14px}
.usebal small{font-weight:700;font-size:.78rem;color:#5A5688}.usebal b{font-family:var(--display);font-size:1.15rem;line-height:1.15;font-variant-numeric:tabular-nums}
.usebal.new{background:#1B1840;color:#fff}.usebal.new small{color:#C9C6EE}
.usehud>i{font-style:normal;font-weight:800;font-size:1.2rem;color:#1B1840}
.usecap{position:absolute;right:14px;bottom:16px;width:min(400px,calc(100% - 28px));display:grid;gap:8px;background:#fff;color:#1B1840;border:3px solid #1B1840;border-radius:22px;box-shadow:0 6px 0 #1B1840;padding:14px 16px}
.usenote{font-family:var(--display);font-size:1.05rem;line-height:1.3}.usenote.bad{color:#B3261E}
.usetext{font-size:.98rem;line-height:1.4}
/* while an errand runs the card only says what is happening */
.usebusy .usenote,.usebusy .mrbtns{display:none}
.usebusy .usetext{font-family:var(--display);font-weight:700;font-size:1.05rem}
.usetext .die{font-size:1.5rem;vertical-align:middle;margin-right:4px}
.usecoin{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:#F7931A;color:#fff;border:2.5px solid #1B1840;display:grid;place-items:center;font:800 1rem/1 var(--body);font-style:normal;pointer-events:none;z-index:2}
.walking .mapbob{animation:usebob .2s ease-in-out infinite alternate}
@keyframes usebob{to{transform:translateY(-5px)}}
.mapfate{transition:filter .4s,opacity .4s}.usegone{filter:grayscale(1) brightness(.3);opacity:.45}
.usepop{pointer-events:none;transform-box:fill-box;transform-origin:50% 100%;animation:fxpop .45s both}
.mapglide .map{transition:transform .8s ease-in-out} /* the zoomed-in map following you */
@media (max-width:760px){
  .mapcard.use .map{inset:64px 0 176px;height:calc(100% - 240px)}
  .usehud{left:10px;top:8px;gap:6px}.usebal{min-width:0;padding:5px 12px}
  .usecap{left:10px;right:10px;bottom:14px;width:auto}
}
@media (prefers-reduced-motion:reduce){.walking .mapbob,.usepop{animation:none!important}.mapglide .map,.mapfate{transition:none}}
/* Arriving on Build (see go in ui.js). --bd scales every delay: 1 for the full show, less for the quick one. */
.mapcard.arrive{--bd:1}.mapcard.arrive.short{--bd:.18}
/* the blueprint: a slanted band of blue grid paper crosses the map, which shows through it as pale shapes */
.bpwipe{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(rgb(255 255 255/.4) 1.5px,transparent 1.5px) 0 0/28px 28px,linear-gradient(90deg,rgb(255 255 255/.4) 1.5px,transparent 1.5px) 0 0/28px 28px,rgb(24 84 214/.64);
  -webkit-backdrop-filter:grayscale(1) contrast(1.6) brightness(1.5);backdrop-filter:grayscale(1) contrast(1.6) brightness(1.5);animation:bpwipe 1.15s ease-in-out both}
@keyframes bpwipe{0%{clip-path:polygon(0 0,0 0,-40% 100%,-40% 100%)}42%,56%{clip-path:polygon(0 0,140% 0,100% 100%,-40% 100%)}100%{clip-path:polygon(140% 0,140% 0,100% 100%,100% 100%)}}
.bcrane,.bsign,.bcone,.bhat{transform-box:fill-box;transform-origin:50% 100%}
.arrive .bcrane{animation:bcrane .6s calc(var(--bd)*.5s) cubic-bezier(.3,1.4,.5,1) both}
@keyframes bcrane{from{transform:scaleY(0);opacity:0}30%{opacity:1}to{transform:none}}
.arrive .bsign,.arrive .bcone{animation:fxpop .45s calc(var(--bd)*.9s) both}
.arrive .bhat{animation:bhat .55s calc(var(--bd)*1.1s) cubic-bezier(.3,1.5,.5,1) both}
@keyframes bhat{from{transform:translateY(-150px);opacity:0}30%{opacity:1}to{transform:none}}
.arrive .mapbanner{animation:fxbar .45s calc(var(--bd)*1.35s) both}
/* the two ways to build come down on a cable, which goes once they have landed */
.mapcard.build .maptool[data-act="suggest"]::before,.mapcard.build .maptool[data-act="editBase"]::before{content:"";position:absolute;left:50%;bottom:100%;width:3px;height:100vh;margin-left:-1.5px;background:#1B1840;opacity:0;pointer-events:none}
.arrive .maptool[data-act="suggest"],.arrive .maptool[data-act="editBase"]{animation:bhook .7s calc(var(--bd)*1.45s) cubic-bezier(.3,1.25,.5,1) both}
.arrive .maptool[data-act="editBase"]{animation-delay:calc(var(--bd)*1.62s)}
.arrive .maptool[data-act="suggest"]::before,.arrive .maptool[data-act="editBase"]::before{animation:bcable 1.5s calc(var(--bd)*1.45s) both}
@keyframes bhook{from{transform:translateY(-100vh)}to{transform:none}}
@keyframes bcable{0%,65%{opacity:1}100%{opacity:0}}
/* arriving on "Use it": the same sweep in gold, dotted with coins; then the pills drop in and the card comes up */
.bpwipe.gold{background:radial-gradient(circle at 16px 16px,rgb(255 255 255/.6) 0 6px,transparent 7px) 0 0/32px 32px,rgb(247 147 26/.66)}
.use.arrive .usebal,.use.arrive .usehud>i{animation:usedrop .5s calc(var(--bd)*.95s) cubic-bezier(.3,1.4,.5,1) both}
.use.arrive .usehud>i{animation-delay:calc(var(--bd)*1.05s)}.use.arrive .usebal.new{animation-delay:calc(var(--bd)*1.15s)}
@keyframes usedrop{from{transform:translateY(-90px);opacity:0}40%{opacity:1}to{transform:none}}
.use.arrive .usecap{animation:fxbar .45s calc(var(--bd)*1.4s) both}
/* going on to "Use it": the site packs up first */
.leaving .bcrane,.leaving .bsign,.leaving .bcone,.leaving .bhat{animation:bgone .35s ease-in both}
@keyframes bgone{to{opacity:0;transform:translateY(-34px) scale(.8)}}
@media (prefers-reduced-motion:reduce){.bpwipe{display:none}.arrive .usebal,.arrive .usehud>i,.arrive .usecap,.arrive .bcrane,.arrive .bsign,.arrive .bcone,.arrive .bhat,.arrive .mapbanner,.arrive .maptool,.arrive .maptool::before{animation:none!important}}
/* Share: the closing words over the sea, and under them the island with everybody dancing on it (SetupMap.party). */
.party{flex:1;display:flex;flex-direction:column;width:100vw;margin-left:calc(50% - 50vw);overflow:hidden}
.party .finish{margin:2vh auto 0;padding:0 16px;color:#1B1840}.party .finish .lede{color:#1B1840}
.partymap{flex:1 1 0;height:0;min-height:300px;width:100%;display:block} /* whatever height is left under the words, never its own */
.dancer{transform-box:fill-box;transform-origin:50% 100%;animation:dance0 .5s var(--t,0s) ease-in-out infinite alternate}
.dancer.d1{animation-name:dance1;animation-duration:.42s}.dancer.d2{animation-name:dance2;animation-duration:.36s}
@keyframes dance0{from{transform:translateY(0) rotate(-7deg)}to{transform:translateY(-14px) rotate(7deg)}}
@keyframes dance1{from{transform:rotate(-11deg)}to{transform:rotate(11deg)}}
@keyframes dance2{from{transform:scale(1.07,.9)}to{transform:translateY(-24px) scale(.95,1.06)}}
.partynote{paint-order:stroke;animation:partynote 2.6s var(--t,0s) linear infinite}
@keyframes partynote{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(16px,-80px)}}
@media (max-width:760px){.partymap{width:150%;margin-left:-25%}}
@media (prefers-reduced-motion:reduce){.dancer,.partynote{animation:none!important}}
/* Build, wider screens: "Try a disaster" is the round icon in the top right corner, as it is on a phone. The row of
   buttons is stretched to the top of the card so the icon can sit there; the stretched box lets clicks through to the map. */
@media (min-width:761px){
  .mapcard.build .maptools{top:10px;align-items:flex-end;pointer-events:none}
  .mapcard.build .maptool{pointer-events:auto;position:relative} /* relative: for the cable it arrives on */
  .mapcard.build .maptool[data-act="simBase"]{position:absolute;top:0;right:0;width:48px;padding:0;gap:0;font-size:0}
}
.maptool:hover{transform:translateY(-2px);box-shadow:0 6px 0 #1B1840}
.maptool:active,.maptool[aria-pressed="true"]{transform:translateY(3px);box-shadow:0 1px 0 #1B1840;background:#FFD84D}
#mapitem{width:auto;min-width:min(260px,calc(100vw - 24px));max-width:min(340px,calc(100vw - 24px));border-radius:18px;overflow:visible}
.mappop{padding:18px 20px;display:grid;gap:10px}
.mappop h3{font-size:1.1rem}.mappop p{margin:0;color:var(--muted);font-size:.92rem}
.mappop button{justify-self:start}
.mappop .mapjoke{font-style:italic}
/* who you play as: something they really said, then the faces to pick from */
.mapquote{margin:0;padding:10px 14px;border-radius:12px;background:var(--soft);font-weight:700;line-height:1.35}
.mapquote cite{display:block;margin-top:4px;font-style:normal;font-weight:500;font-size:.82rem;color:var(--muted)}
.mapwho{display:flex;flex-wrap:wrap;gap:2px}
.mappop .mapface{padding:1px;border:2px solid transparent;border-radius:14px;background:none;cursor:pointer;line-height:0}
.mapface img{height:35px;width:auto;display:block}
.mapface:hover{background:var(--soft)}
.mapface[aria-pressed="true"]{border-color:#F7931A;background:var(--soft)}
.mapkb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;font-size:.72rem;font-weight:800;color:#1B1840;margin:0 6px 0 0;vertical-align:1px}
.mappop h3 .mapkb{margin:0 0 0 4px}
.maprow{display:flex;justify-content:space-between;align-items:center;gap:14px;font-weight:600}
.mapsecret.shown,.mapsheet{font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;font-size:1.1rem}
/* a memorized value: dots until clicked, then the value; click again to hide it */
.mapsecret{border:0;background:var(--soft);color:var(--ink);border-radius:10px;padding:5px 10px;font:inherit;font-weight:700;letter-spacing:.14em;cursor:pointer;text-align:right;max-width:60%}
.mapsecret:hover{background:var(--line)}
.mapsecret.shown{letter-spacing:0;background:#FFF4C2;color:#1B1840}
.mapsheet{background:#FFFDF2;color:#1B1840;border-radius:4px;padding:12px 14px;columns:2;transform:rotate(-2deg);box-shadow:3px 4px 0 rgb(0 0 0/.12)}
.mapseed{position:relative;padding-right:58px}

/* ---------- a disaster playing on the map (prototype) ----------
   0s the icon drops onto the place; .6s flames or a thief; 1.2s the things there react; 2s the result bar. */
.fxdrop{animation:fxdrop .6s cubic-bezier(.5,0,.9,.6) both,fxgone .3s .9s both}
.fxfire{animation:fxin .4s .55s both}
.fxflame{transform-box:fill-box;transform-origin:50% 100%;animation:fxflick .5s ease-in-out var(--t,0s) infinite alternate}
.fxsmoke{opacity:0;animation:fxsmoke 2.4s ease-out calc(.8s + var(--t,0s)) infinite}
.fxthief{animation:fxthief 2.6s .55s both}
.fxbolt{opacity:0;animation:fxbolt 1.1s .5s both}
.fxlock{transform-box:fill-box;transform-origin:50% 50%;animation:fxpop .45s .55s both}
.fxpoof{animation:fxin .3s .55s both}.fxpuff{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:fxpuff 1.6s ease-out calc(.6s + var(--t,0s)) infinite}
.fxtime{animation:fxin .3s .55s both}.fxhand{transform-box:view-box;transform-origin:0 0;animation:sc-turn .7s linear infinite}.fxhand.slow{animation-duration:4s}
.fate-hacked{animation:fxhack .5s 1.3s both}
.mapfate{transform-box:fill-box;transform-origin:50% 100%}
.fate-gone{animation:fxburn .8s 1.2s both}
.fate-taken{animation:fxtake .7s 1.5s both}
.fate-safe{animation:fxsafe .5s 1.4s both}
.fxmark{opacity:0;animation:fxin .3s 2s both}
/* left over from an earlier disaster in the same run: drawn as it ended up, with no replay */
.mapfate.was,.fxmark.was{animation:none}.fxmark.was{opacity:1}
.fate-gone.was{filter:grayscale(1) brightness(.3);opacity:.45;transform:scale(.82) rotate(-6deg)}
.fate-taken.was{opacity:.12;transform:translate(34px,-10px) scale(.45)}
.fate-hacked.was{filter:saturate(.5) brightness(.85)}
/* which setup this map is, and (on the Build screen) the next recommended changes as tappable cards */
.maplabel{position:absolute;left:14px;top:10px;background:#1B1840;color:#fff;font-family:var(--display);font-weight:700;font-size:.95rem;padding:6px 14px;border-radius:14px}
.mapintro .maplabel{opacity:0}
/* zoom and drag (see setMapView in ui.js). touch-action: the map handles its own drags and pinches. */
.map{transform:translate(var(--mx,0px),var(--my,0px)) scale(var(--mk,1));touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.mapintro .map{cursor:pointer}
.mapdrag .map,.mapdrag .maptap{cursor:grabbing}
.mapcards{position:absolute;right:14px;bottom:80px;width:min(320px,calc(100% - 28px));display:grid;gap:8px} /* bottom right, over open sea beside the island */
.mapcardtip{display:grid;gap:3px;text-align:left;background:#fff;color:#1B1840;border:3px solid #1B1840;border-radius:16px;box-shadow:0 4px 0 #1B1840;padding:10px 14px;font-size:.9rem;cursor:pointer;transition:transform .12s,box-shadow .12s}
button.mapcardtip:hover{transform:translateY(-2px);box-shadow:0 6px 0 #1B1840}
button.mapcardtip:active{transform:translateY(3px);box-shadow:0 1px 0 #1B1840}
.mapcardtip small{font-weight:700;color:#5A5688}.mapcardtip b{font-size:.98rem;line-height:1.25}.mapcardtip span{color:#5A5688;font-size:.84rem}
.mapcardtip.done{cursor:default;background:#E3F6EA}
/* the suggestions are a panel opened by "Suggest a step": a heading with a close button, then the steps */
.mapcardshead{position:relative;display:flex;align-items:center;min-height:40px;padding:4px 48px 4px 14px;background:#1B1840;color:#fff;border-radius:16px;font-family:var(--display);font-size:1rem}
.mapcardshead .mrx{right:3px;top:3px}
/* Arriving on Build: what this screen is for, above the two ways to do it. It goes once the new setup differs. */
.mapbanner{position:absolute;right:14px;bottom:80px;width:min(380px,calc(100% - 28px));display:grid;gap:3px;background:#1B1840;color:#fff;border-radius:16px;padding:12px 16px;text-align:center;pointer-events:none}
.mapbanner b{font-family:var(--display);font-size:1.15rem}.mapbanner span{font-size:.9rem;opacity:.85}
/* phones: the cards or the result sit between the map and the buttons, and the map moves up to make room */
@media (max-width:760px){
  .mapcards,.mapresult,.mapbanner{bottom:80px;left:10px;right:10px;width:auto}
  .mapcard.build.fwd .mapcards,.mapcard.build.fwd .mapresult,.mapcard.build.fwd .mapbanner{bottom:138px} /* above both rows of buttons */
  .mapcardtip{padding:7px 12px;gap:1px}.mapcardtip b{font-size:.9rem}
  .mapcard.lift{min-height:680px}
  .mapcard.lift .map{inset:44px 0 356px;height:calc(100% - 400px)}
}
/* The result of a disaster: a sticker like the map's buttons. The disaster's emoji is a badge on the corner, the verdict
   is stamped on, and when the coins are gone the card turns over to show how it could have been stopped (.why). */
.mapresult{position:absolute;right:14px;bottom:80px;width:min(380px,calc(100% - 28px));background:#fff;color:#1B1840;border:3px solid #1B1840;border-radius:22px;box-shadow:0 6px 0 #1B1840;padding:16px 16px 14px;animation:fxbar .45s 2.1s cubic-bezier(.3,1.5,.5,1) both}
.mrbadge{position:absolute;left:-16px;top:-22px;width:58px;height:58px;border-radius:50%;border:3px solid #1B1840;box-shadow:0 4px 0 #1B1840;display:grid;place-items:center;font-size:1.9rem;line-height:1;transform:rotate(-8deg)}
.mapresult.bad .mrbadge{background:#FFB3A7}.mapresult.ok .mrbadge{background:#A9EBC0}
.mrx{z-index:1;position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:2.5px solid #1B1840;background:#fff;color:#1B1840;box-shadow:0 3px 0 #1B1840;font:700 1.3rem/1 var(--body);display:grid;place-items:center;padding:0 0 2px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.mrx:hover{transform:translateY(-1px);box-shadow:0 4px 0 #1B1840}.mrx:active{transform:translateY(3px);box-shadow:0 0 0 #1B1840}
.mrface>b,.mrface>.tagline,.mrfix>b{padding-right:36px} /* clear of the × */
.mrface,.mrfix{display:grid;gap:8px}
.mrfix,.mapresult.why .mrface{display:none}.mapresult.why .mrfix{display:grid;animation:mrturn .3s cubic-bezier(.3,1.5,.5,1) both}
.mapresult b{font-family:var(--display);font-size:1.25rem;line-height:1.1;padding-left:38px}
.mapresult .tagline{color:#5A5688;font-size:.9rem;margin-top:-4px;padding-left:38px}
.mrbody{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:2px}
.mrbody>span:first-child{line-height:1.35}
.mapresult .runs{display:block;color:#5A5688;font-weight:700;font-size:.84rem;margin-top:2px}
.mrstamp{pointer-events:none;flex:none;font-family:var(--display);font-weight:800;font-size:1.02rem;line-height:1;text-transform:uppercase;letter-spacing:.06em;text-align:center;max-width:6.5em;padding:7px 9px;border:3px solid;border-radius:9px;transform:rotate(-9deg);animation:mrstamp .3s 2.6s cubic-bezier(.2,1.2,.4,1) both}
.mapresult.seen .mrstamp{animation:none} /* turned over and back: the stamp has been seen. pointer-events: while it waits to land it is invisible and oversized, and must not sit on top of the × */
.mapresult.bad .mrstamp{color:#D7263D;background:#FFF1F1}.mapresult.ok .mrstamp{color:#12924F;background:#EEFBF3}
.mrbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.mrbtn{border:2.5px solid #1B1840;border-radius:99px;background:#fff;color:#1B1840;box-shadow:0 3px 0 #1B1840;font:700 .9rem/1 var(--body);padding:8px 13px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.mrbtn.main{background:#FFD84D}
.mrbtn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #1B1840}.mrbtn:active{transform:translateY(3px);box-shadow:0 0 0 #1B1840}
.mrdo{display:grid;gap:3px;justify-items:start}
.mrdo strong{font-size:1rem;line-height:1.25}.mrdo span{color:#5A5688;font-size:.88rem;line-height:1.3}
.mrdo small{font-weight:800;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#5A5688;margin-top:4px}
.mrdo .mrbtn{margin-top:4px}
.mapresult.change{animation-delay:.1s}.mapresult.change .mrbadge{font-size:1.6rem}
.mapresult.change .mrface>b{font-size:1.1rem;padding-right:44px}
.mrrisks{display:grid;gap:3px;font-size:.95rem}
.mrrisks span{display:flex;align-items:center;gap:6px;white-space:nowrap}.mrrisks i{flex:none;width:12px;height:12px;border-radius:50%}.mrrisks small{color:#5A5688}
.mapresult .mrrisks b{font:700 .95rem/1.3 var(--body);padding:0}
@media (max-width:760px){.mapcard.build.fwd.lift .map{inset:44px 0 404px;height:calc(100% - 448px)}} /* two rows of buttons under the card */
@keyframes mrstamp{from{opacity:0;transform:rotate(-20deg) scale(2.6)}to{opacity:1;transform:rotate(-9deg) scale(1)}}
@keyframes mrturn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes fxbar{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fxdrop{from{transform:translateY(-340px);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
@keyframes fxgone{to{opacity:0}}
@keyframes fxin{from{opacity:0}to{opacity:1}}
@keyframes fxflick{from{transform:scale(1,.86) skewX(-4deg)}to{transform:scale(1.06,1.12) skewX(4deg)}}
@keyframes fxsmoke{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:.5}100%{opacity:0;transform:translateY(-70px) scale(1.8)}}
@keyframes fxthief{0%{opacity:0;transform:translateX(var(--from))}22%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateX(var(--from))}}
@keyframes fxburn{to{filter:grayscale(1) brightness(.3);opacity:.45;transform:scale(.82) rotate(-6deg)}}
@keyframes fxtake{to{opacity:.12;transform:translate(34px,-10px) scale(.45)}}
@keyframes fxsafe{50%{transform:scale(1.22)}}
@keyframes fxbolt{0%,100%{opacity:0}8%,24%,46%{opacity:1}16%,36%{opacity:.15}70%{opacity:1}}
@keyframes fxpop{from{opacity:0;transform:translateY(-60px) scale(.5)}60%{opacity:1;transform:translateY(4px) scale(1.12)}to{opacity:1;transform:none}}
@keyframes fxpuff{0%{opacity:0;transform:scale(.4)}25%{opacity:.85}100%{opacity:0;transform:scale(1.7)}}
@keyframes fxhack{20%{transform:translateX(-5px) rotate(-5deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(3px)}to{transform:none;filter:saturate(.5) brightness(.85)}}
/* reduced motion: no movement, just the end state (what was hit, marked, and the result) */
@media (prefers-reduced-motion:reduce){
  /* the map's introduction still plays, step by step, without the movement: things, captions and arrows appear in place */
  .mapintro .mapstep.in,.mapcap.in,.mapline .pen,.mapline .pen.head{animation:none!important}
  .fxdrop,.fxthief,.fxbolt,.fxsmoke,.fxpoof{display:none}
  .fxfire,.fxflame,.fxlock,.fxtime,.fxhand,.fxmark,.mapresult,.mrstamp,.fate-gone,.fate-taken,.fate-safe,.fate-hacked{animation:none!important;opacity:1}
  .fate-gone{filter:grayscale(1) brightness(.3);opacity:.45}.fate-taken{opacity:.15}.fate-hacked{filter:saturate(.5) brightness(.85)}
}
/* ---------- landing scene ---------- */
#scene{display:none}
body.landing{overflow-x:clip;background:linear-gradient(var(--sky),var(--sky2) 62%) no-repeat var(--sky2)}
.landing body::before,body.landing::before{background:var(--sky)}
.btn.cta{font-size:1.15rem;padding:15px 28px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.btn.cta:hover{transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn.cta:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.landing .wrap{min-height:100svh;display:flex;flex-direction:column;padding-bottom:0}
.landing .grid{position:relative;z-index:1}
.landing .steps{display:none} /* no step links on the first screen; they come back from the second screen on */
.landing #scene{display:block;position:relative;flex:1;min-height:260px;width:100vw;margin:0 0 0 calc(50% - 50vw);pointer-events:none}
/* The drawing stands on the bottom of the scene at the scale ui.js chose (--s). On a tall, narrow screen that is less than
   the scene's height, so more of the sky shows above it. */
#scene svg{position:absolute;left:0;bottom:0;width:100%;height:calc(var(--s,1)*450px);display:block;overflow:visible}
/* a narrow window shows only the middle of the drawing, so the buildings come in to the roadside there */
#scene.narrow #sc-bank{transform:translate(352px,470px) scale(.42)}
#scene.narrow #sc-home{transform:translate(262px,512px) scale(.6)}
#scene.narrow #sc-friend{transform:translate(930px,505px) scale(.55)}
.landing footer{position:relative;isolation:isolate;margin:0;padding:14px 0 16px;color:#F1EFFF}
.landing footer::before{content:"";position:absolute;z-index:-1;top:-1px;bottom:0;left:calc(50% - 50vw);width:100vw;background:var(--road2)}
.sc-night{opacity:var(--night)}.sc-day{opacity:calc(1 - var(--night))}
.sc-far{filter:brightness(calc(1 - var(--night)*.6))} /* the map's buildings keep their own colours, so they are dimmed at night instead */
/* ---------- landing car: flat panels in 3D, see buildCar() in ui.js ---------- */
#scene{isolation:isolate}
#scene .sc-front{z-index:2}
#sc-carbox{position:absolute;left:0;right:0;bottom:0;height:200vh;overflow:hidden;z-index:3;pointer-events:none}
#car3d{position:absolute;left:50%;bottom:0;width:0;height:0;transform:scale(var(--s,1))}
#car3d div{position:absolute}
#sc-mover,#sc-persp,#car3d .g{left:0;top:0;width:0;height:0}
#sc-mover{transform:translate(0px,-104px) scale(.8)}
#sc-persp{perspective:1600px}
#car3d .g{transform-style:preserve-3d}
#sc-tilt{transform:rotateX(-8deg)}
#car3d .pl svg{display:block;width:100%;height:100%}
/* ---------- landing entrance: plays once while body has .intro ---------- */
/* The car waits out of sight behind the front hill, then jumps over the crest and lands. Units are the drawing's, measured
   from its bottom centre. Each clip is 3s long but starts 1.35s in, so the whole entrance takes 1.65s. */
.landing .stage>*{transition:opacity .5s,transform .5s}
.landing .stage>h1+p{margin-top:12px} /* the pen underline hangs below the headline, so the line after it needs more room */
.intro.landing .stage>*{opacity:0;transform:translateY(10px);pointer-events:none}
.intro #sc-carbox{animation:sc-layer 3s -1.35s both}
.intro #sc-mover{animation:sc-move 3s -1.35s linear both}
.intro #sc-yaw{animation:sc-yaw 3s -1.35s linear both}
.intro #sc-pitch{animation:sc-pitch 3s -1.35s both}
.intro #car3d .sc-spin{animation:sc-spin .45s linear infinite}
.intro #sc-shadow{animation:sc-shadow 3s -1.35s both;transform-origin:600px 500px}
.intro .sc-dust{animation:sc-dust 3s -1.35s both}
@keyframes sc-layer{0%,70%{z-index:1}70.1%,100%{z-index:3}}
@keyframes sc-move{0%,55%{transform:translate(0px,150px) scale(.56);animation-timing-function:cubic-bezier(.2,.7,.3,1)}70%{transform:translate(0px,-178px) scale(.74);animation-timing-function:cubic-bezier(.5,0,.9,.5)}80%{transform:translate(0px,-104px) scale(.8)}84%{transform:translate(0px,-104px) scale(.86,.71)}90%{transform:translate(0px,-104px) scale(.775,.84)}95%{transform:translate(0px,-104px) scale(.81,.785)}100%{transform:translate(0px,-104px) scale(.8)}}
@keyframes sc-yaw{0%,80%{transform:rotateY(0deg)}85%{transform:rotateY(5deg)}93%{transform:rotateY(-2deg)}100%{transform:rotateY(0deg)}}
@keyframes sc-pitch{0%,55%{transform:rotateX(16deg)}70%{transform:rotateX(0deg)}79%{transform:rotateX(-9deg)}85%{transform:rotateX(4deg)}100%{transform:rotateX(0deg)}}
@keyframes sc-spin{to{transform:rotateX(-360deg)}}
@keyframes sc-shadow{0%,70%{opacity:0;transform:scale(.5)}80%{opacity:.3;transform:scale(1)}84%{transform:scale(1.08)}100%{opacity:.3;transform:scale(1)}}
@keyframes sc-dust{0%,79%{opacity:0;transform:scale(.2)}88%{opacity:1;transform:scale(1.2)}100%{opacity:1;transform:scale(1)}}
/* ---------- landing: notes over the scene, one at a time (see NOTES in ui.js) ---------- */
#scene .sc-notes{z-index:4}
.sc-note{opacity:0;transition:opacity .3s}.sc-note.on{opacity:1}
.intro .sc-note,.leaving .sc-note{opacity:0}
.pen{fill:none;stroke:#F47B20;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:0}
.sc-notes text{font:800 25px var(--display);fill:#1B1840;stroke:#fff;stroke-width:7px;stroke-linejoin:round;paint-order:stroke}
/* the speech bubble grows up and to the right from beside the driver's head */
#sc-say{position:absolute;z-index:4;left:calc(50% + var(--s,1)*46px);bottom:calc(var(--s,1)*404px);max-width:min(250px,calc(50vw - var(--s,1)*46px - 10px));padding:9px 13px;background:#fff;color:#1B1840;border:3px solid #1B1840;border-radius:18px;box-shadow:3px 4px 0 #1B1840;font:700 .9rem/1.25 var(--body);transform-origin:0 100%}
#scene.narrow #sc-say{bottom:calc(var(--s,1)*364px);font-size:.8rem} /* on a phone it sits lower, clear of the text above */
#sc-say::after{content:"";position:absolute;left:14px;bottom:-10px;width:14px;height:14px;background:#fff;border:solid #1B1840;border-width:0 3px 3px 0;transform:skewX(-28deg) rotate(45deg)} /* the tail leans down and to the left, towards the driver */
/* ---------- landing: text ---------- */
.scribble{position:relative;white-space:nowrap}
.scribble svg{position:absolute;left:-2%;top:88%;width:104%;overflow:visible;pointer-events:none}
.scribble path{fill:none;stroke:#F47B20;stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
#car3d .pl{pointer-events:auto;cursor:pointer}
.sc-dust{opacity:0}
.sc-boat{transform:translate(calc((var(--x0) + var(--x1))/2),var(--y)) scale(var(--s))}
.sc-birds{opacity:0}
/* ---------- landing: everything that moves once the car has landed. None of it runs under reduced motion. ---------- */
@media (prefers-reduced-motion:no-preference){
  .scribble path{animation:sc-draw .45s ease-out .35s both}.scribble path+path{animation-delay:.75s}
  .intro .scribble path{animation:none;stroke-dashoffset:1}
  /* the car: engine running, a slow sway, the driver glancing about and waving now and then */
  body:not(.intro) #sc-pitch{animation:sc-bob .5s ease-in-out infinite alternate}
  body:not(.intro) #sc-yaw{animation:sc-sway 7s ease-in-out infinite alternate}
  #c3-driver .maphead{transform-box:fill-box;transform-origin:50% 85%;animation:sc-look 11s ease-in-out infinite}
  body:not(.intro) #car3d .c3-wave{animation:sc-wave 9s ease-in-out 2.5s infinite}
  .landed .sc-dust{animation:sc-dust-away 1.8s ease-out both}
  .sc-note.on .pen{animation:sc-draw .4s ease-out both}.sc-note.on .pen.head{animation:sc-head .16s ease-out .38s both}
  #sc-say.on{animation:sc-pop .4s cubic-bezier(.3,1.6,.5,1) both}
  /* tap the car: a hop, then it sets off. Hover the button: it revs and the driver looks over. */
  #sc-mover.hop{animation:sc-hop .7s both}
  #sc-mover.hop .sc-spin,body:has(.cta:hover) #car3d .sc-spin,.leaving #car3d .sc-spin{animation:sc-spin .4s linear infinite}
  body:has(.cta:hover):not(.intro) #sc-pitch{animation-duration:.14s}
  body:has(.cta:hover) #c3-driver .maphead{animation:none;transform:rotate(-9deg)}
  /* "Get started": it drives off toward you */
  .leaving #sc-mover{animation:sc-leave .62s cubic-bezier(.5,0,.9,.4) both}
  .leaving .stage>*{opacity:0;transform:translateY(-10px)}
  /* the sky and the sea */
  .sc-cloud{animation:sc-drift var(--d) ease-in-out infinite alternate}
  body:not(.intro) #sc-rays{animation:sc-turn 300s linear infinite} /* barely moving, and not at all until the car has landed */
  .sc-glint{animation:sc-glint 4s ease-in-out var(--t) infinite}
  .sc-boat{animation:sc-sail var(--d) linear var(--t) infinite}
  .sc-birds{animation:sc-fly var(--d) linear var(--t) infinite}
  /* a light breeze: each tree leans a degree or so from the foot of its trunk */
  .sc-tree{transform-origin:0 36px;animation:sc-lean var(--d) ease-in-out var(--t) infinite alternate}
  .sc-tuft{animation:sc-lean 3.2s ease-in-out var(--t,0s) infinite alternate;--lean:5deg}
  .sc-flap{transform-box:fill-box;transform-origin:center;animation:sc-flap .5s ease-in-out var(--t,0s) infinite alternate}
}
@keyframes sc-pop{from{transform:scale(.4)}to{transform:scale(1)}}
@keyframes sc-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes sc-head{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}100%{stroke-dashoffset:0;opacity:1}} /* hidden outright until its turn, so no stray dots */
@keyframes sc-bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes sc-sway{from{transform:rotateY(-4deg)}to{transform:rotateY(4deg)}}
@keyframes sc-look{0%,38%,62%,88%,100%{transform:rotate(0deg)}44%,56%{transform:rotate(-6deg)}68%,82%{transform:rotate(6deg)}}
@keyframes sc-wave{0%,62%,100%{transform:rotateZ(0deg) rotateX(0deg)}68%{transform:rotateZ(20deg) rotateX(107deg)}73%{transform:rotateZ(36deg) rotateX(107deg)}78%{transform:rotateZ(8deg) rotateX(107deg)}83%{transform:rotateZ(36deg) rotateX(107deg)}88%{transform:rotateZ(8deg) rotateX(107deg)}93%{transform:rotateZ(20deg) rotateX(107deg)}}
@keyframes sc-dust-away{from{opacity:1;transform:scale(1)}to{opacity:0;transform:translate(calc(var(--dx)*46px),-14px) scale(1.5)}}
@keyframes sc-hop{0%,100%{transform:translate(0px,-104px) scale(.8)}40%{transform:translate(0px,-172px) scale(.78,.82);animation-timing-function:cubic-bezier(.5,0,.9,.5)}66%{transform:translate(0px,-104px) scale(.8)}76%{transform:translate(0px,-104px) scale(.85,.73)}88%{transform:translate(0px,-104px) scale(.785,.82)}}
@keyframes sc-leave{0%{transform:translate(0px,-104px) scale(.8)}18%{transform:translate(0px,-98px) scale(.76,.84)}100%{transform:translate(0px,330px) scale(3.4)}}
@keyframes sc-drift{from{transform:translateX(0)}to{transform:translateX(var(--x))}}
@keyframes sc-turn{to{transform:rotate(360deg)}}
@keyframes sc-glint{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes sc-sail{from{transform:translate(var(--x0),var(--y)) scale(var(--s))}to{transform:translate(var(--x1),var(--y)) scale(var(--s))}}
@keyframes sc-fly{0%{opacity:1;transform:translate(var(--x0),var(--y0))}45%{opacity:1;transform:translate(var(--x1),var(--y1))}45.1%,100%{opacity:0;transform:translate(var(--x1),var(--y1))}}
@keyframes sc-lean{from{transform:rotate(calc(var(--lean,1.3deg)*-1))}to{transform:rotate(var(--lean,1.3deg))}}
@keyframes sc-flap{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.die{animation:none!important}}

<script>
/* ---------- model ---------- */
const PLACES={home:'🏠 Home',office:'🏢 Office',relative:'👪 Relative’s place',friend:'🤝 Friend’s place',bank:'🏦 Bank box',carry:'🎒 On you'};
const PLAIN={home:'home',office:'the office',relative:'a relative’s place',friend:'a friend’s place',bank:'the bank box',carry:'your pocket'};
const TYPES={keys:'Self custody',exchange:'On an exchange',fintech:'In a payment app',bank:'With a bank or broker',etf:'In an ETF'};
const WHERE={keys:'Self custody',collab:'Collaborative custody (provider)',exchange:'On an exchange',fintech:'In a payment app',bank:'With a bank or broker',etf:'In an ETF'};
const HOLDER={exchange:'the exchange',fintech:'the app',bank:'the bank',etf:'the fund'};
const ACCT={exchange:'Exchange account',fintech:'Payment app',bank:'Bank account'};
const DEVICES={hw:'Hardware signer',phone:'Phone wallet',laptop:'Laptop wallet',prov:'Held by a provider',prov2:'Held by a second provider',none:'No device, backup only'};
const BRANDS={A:'Brand A',B:'Brand B',C:'Brand C',D:'DIY'};
const HWBRANDS={A:'Brand A',B:'Brand B',C:'Brand C',D:'DIY, self-built'};
const PBRANDS={A:'Brand A',B:'Brand B',C:'Brand C'};
const bname=b=>b==='D'?'DIY signer':BRANDS[b];
const BACKUPS={metal:'Metal plate',paper:'Paper',memory:'Memorized',cloud:'Cloud or password manager',none:'No backup'};
const PINS={none:'None',simple:'Simple',strong:'Strong'};
const PASSES={none:'None',memory:'Memorized',written:'Written down'};
const CONFIGS={none:'Only in the wallet app',one:'One extra copy',all:'A copy with every seed backup'};
const ENTS={device:'The device or app',dice:'Device plus your dice rolls',diceonly:'Your dice rolls only',words:'Words you picked yourself'};
const LETTERS='12345'; // keys are numbered, so they can't be mistaken for brands A, B, C

function newKey(){return{device:'hw',brand:'A',dloc:'home',pin:'simple',backup:'paper',bloc:'home',pass:'none',ploc:'home',ent:'device',net:'online',pstr:'simple',conn:'usb'}}
function provKey(d){return Object.assign(newKey(),{device:d||'prov',backup:'none',brand:d==='prov2'?'B':'A'})}
function newSetup(){return{type:'keys',login:'sms',wd:'none',m:1,n:1,keys:[newKey()],config:'none',cloc:'home',tested:false,tl:'off',rkey:newKey()}}
function clone(o){return JSON.parse(JSON.stringify(o))}
const isProv=k=>k.device==='prov'||k.device==='prov2';

function elabel(e,setups){

    return u.length===1?(u[0]==='phone'?'Malware on your phone':'Malware on your computer'):e.label;
  }
  if(!e.labels)return e.label;
  const u=[...new Set(setups.filter(s=>s&&custodial(s)).map(s=>s.type))];

}

  if(e.guess)return(k.ent==='words'?.9:k.ent==='diceonly'?.02:0)*(k.pass==='none'?1:crack(k));

const DEV_LIFE={hw:.8,phone:.5,laptop:.6,none:0};

function backupLeft(k,e,tested){
  const gone=p=>e.places.includes(p);

  if(k.backup==='paper'&&gone(k.bloc))b=0;
  if(k.backup==='metal'&&gone(k.bloc))b*=e.fire?.85:0;
  if(k.backup==='cloud'&&e.cloud)b=0;

}
function keyAvail(k,e,tested){
  if(e.pure&&e.dead&&e.dead!==k)return 1;

  const gone=p=>e.places.includes(p);
  let dev=DEV_LIFE[k.device]*(k.pin==='strong'?.85:k.pin==='none'?1:.93);
  if(k.device!=='none'&&gone(k.dloc))dev=0;
  if(e.dead===k)dev=0;
  if(e.now&&dev>0)dev=1;
  if(e.pbrands&&k.device==='hw'&&e.pbrands.includes(k.brand))dev*=.6;
  const bak=e.bugloss&&!tested&&k.device==='hw'&&k.brand===e.brand?0:backupLeft(k,e,tested);

  if(k.pass==='written')pass=gone(k.ploc)?0:.9;

function configAvail(s,e){

function lossP(s,e){

      quote:'I’m not Satoshi.',
      jokes:['Says he is not Satoshi. On this island, that is easy to check.','Find him at bitcoin++. Or at any other bitcoin conference, anywhere.','Would replace this joke with one that pays a higher fee.']},
  };
  let WHO='satoshi';
  /* The figure, feet at (0,0), about 103 tall. Every body is the same few parts in different clothes.
     bust: only the head and torso, for the driver's seat on the landing, where the car supplies the arms. */
  function figure(id,carry,bust){
    const c=CHARS[id],k=c.skin,[file,w168]=c.head;
    const legs=bust?()=>'':(col,shoe,bare)=>`<g fill="${bare?k:col}"><rect x="-11" y="-22" width="9" height="20" rx="3"/><rect x="2" y="-22" width="9" height="20" rx="3"/></g>${bare?`<path d="M-13 -25H13L12 -12H1L0 -16L-1 -12H-12Z" fill="${col}"/>`:''}<g fill="${shoe}"><ellipse cx="-7.5" cy="-1.5" rx="7" ry="3.6"/><ellipse cx="7.5" cy="-1.5" rx="7" ry="3.6"/></g>`;
    // arms: skin all the way, with a sleeve over the whole arm or only the top of it. The right one reaches out when carrying.
    const L=c.up?['M-15 -42Q-27 -42 -29 -55',-29,-57,'M-15 -42Q-22 -43 -25 -47']:['M-15 -42Q-22 -34 -20 -24',-20,-22,'M-15 -42Q-19 -39 -20 -35'];
    const R=carry?['M14 -41Q26 -38 34 -24',34,-22,'M14 -41Q20 -41 24 -37']:['M15 -42Q22 -34 20 -24',20,-22,'M15 -42Q19 -39 20 -35'];
    const arm=(a,sleeve,short,wide)=>`<path d="${a[0]}" fill="none" stroke="${short?k:sleeve}" stroke-width="${wide||7}" stroke-linecap="round"/>${short&&sleeve?`<path d="${a[3]}" fill="none" stroke="${sleeve}" stroke-width="${(wide||7)+1}" stroke-linecap="round"/>`:''}<circle cx="${a[1]}" cy="${a[2]}" r="3.8" fill="${k}"/>`;
    const arms=bust?()=>'':(sleeve,short,wide)=>arm(L,sleeve,short,wide)+arm(R,sleeve,short,wide);
    const torso=fill=>`<path d="M-15 -46Q-17 -46 -17 -42L-13 -18H13L17 -42Q17 -46 15 -46Z" fill="${fill}"/>`;
    const suit=(jacket,shirt,tie,len)=>arms(jacket)+torso(jacket)+`<path d="M-6 -46L0 -33L6 -46Z" fill="${shirt}"/><path d="M-1.8 -45h3.6l1.5 ${len-3}L0 ${-45+len}l-3.3 -3z" fill="${tie}"/><path d="M-6 -46L0 -33L6 -46M0 -33V-18" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="1.2"/>`;
    const body={
      satoshi:()=>legs('#5A5F6B','#2B2B33')+suit('#8C8577','#E4ECF2','#3D4A5C',12),
      saylor:()=>legs('#1E2740','#111')+suit('#1E2740','#fff','#F7931A',19),
      hal:()=>legs('#1F2A55','#fff',1)+arms('',1)+torso('#D8343B')+`<rect x="-7.5" y="-40" width="15" height="11" rx="1.5" fill="#fff"/><text x="0" y="-31.6" text-anchor="middle" font-size="8" font-weight="800" fill="#1B1840">09</text>`,
      adam:()=>legs('#3B4A6B','#2B2B33')+arms('#23232B',1)+torso('#23232B')+`<text x="0" y="-30" text-anchor="middle" font-size="7" font-weight="700" font-family="monospace" fill="#7CFFB2">0000</text>`,
      jack:()=>`<defs><radialGradient id="map-tiedye" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#FFE14D"/><stop offset=".3" stop-color="#FF7A59"/><stop offset=".55" stop-color="#E85D9A"/><stop offset=".8" stop-color="#7C66FF"/><stop offset="1" stop-color="#3DC8E8"/></radialGradient></defs>`+legs('#23232B','#B98A55')+arms('#7C66FF',1)+torso('url(#map-tiedye)'),
      andreas:()=>`<defs><pattern id="map-plaid" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#CFE2F3"/><path d="M0 2H7M2 0V7" stroke="#4F7FB5" stroke-width="1.6"/><path d="M0 5.5H7M5.5 0V7" stroke="#fff" stroke-width=".8"/></pattern></defs>`+legs('#8B7B5A','#5B4632')+arms('#9DBFE0')+torso('url(#map-plaid)')+`<path d="M-4 -46L0 -40L4 -46Z" fill="${k}"/><path d="M0 -40V-18" stroke="#4F7FB5" stroke-width="1"/>`,
      // no shirt: wide shoulders, big arms, and a six-pack drawn the way a child would. One arm flexes: out from the
      // shoulder, fist up beside the head, and a bump for the bicep. The other hangs, or holds what he carries.
      breedlove:()=>legs('#23232B','#2B2B33',1)+(bust?'':arm(carry?['M21 -38Q29 -35 34 -24',34,-22]:['M21 -38Q26 -32 24 -23',24,-21],'',1,10)+`<path d="M-21 -38L-34 -37L-32 -53" fill="none" stroke="${k}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-27.5" cy="-41.5" r="6" fill="${k}"/><circle cx="-32" cy="-56" r="5.2" fill="${k}"/><path d="M-32 -45Q-27 -50 -22.5 -45" fill="none" stroke="#9A6B45" stroke-width="1.2" stroke-linecap="round"/>`)+`<circle cx="-21" cy="-37" r="6.5" fill="${k}"/><circle cx="${carry?22:21}" cy="-37" r="6.5" fill="${k}"/><path d="M-21 -46Q-24 -46 -23 -40L-12 -20H12L23 -40Q24 -46 21 -46Z" fill="${k}"/><g fill="none" stroke="#9A6B45" stroke-width="1.3" stroke-linecap="round"><path d="M-14 -40Q-7 -33 -1 -39M1 -39Q7 -33 14 -40"/><path d="M-22 -40Q-25 -37 -23 -33M22 -40Q25 -37 23 -33" opacity=".7"/></g><g fill="#fff" fill-opacity=".28" stroke="#9A6B45" stroke-width="1"><rect x="-6.5" y="-33.5" width="6" height="4" rx="1.6"/><rect x=".5" y="-33.5" width="6" height="4" rx="1.6"/><rect x="-6.5" y="-29" width="6" height="4" rx="1.6"/><rect x=".5" y="-29" width="6" height="4" rx="1.6"/><rect x="-6" y="-24.5" width="5.5" height="4" rx="1.6"/><rect x=".5" y="-24.5" width="5.5" height="4" rx="1.6"/></g><path d="M-8 -46Q0 -37 8 -46" fill="none" stroke="#D8DBE6" stroke-width="1.1"/>`,
      // navy suit, white shirt, no tie, and a steak in his other hand
      saifedean:()=>legs('#27406B','#2B2B33')+arms('#27406B')+torso('#27406B')+`<path d="M-6 -46L0 -34L6 -46Z" fill="#fff"/><path d="M-2.5 -46L0 -40L2.5 -46Z" fill="${k}"/><path d="M-6 -46L0 -34L6 -46M0 -34V-18" fill="none" stroke="#000" stroke-opacity=".22" stroke-width="1.2"/><g transform="translate(-23 -18) rotate(-20)"><path d="M-7 0Q-8 -6 -1 -6Q7 -7 7 -1Q7 5 1 5Q-6 6 -7 0Z" fill="#F1DCCB"/><path d="M-5.4 0Q-6 -4.6 -1 -4.6Q5.4 -5.4 5.4 -1Q5.4 3.6 1 3.6Q-4.8 4.4 -5.4 0Z" fill="#B5413A"/><circle cx="-1.6" cy="-.6" r="1.5" fill="#F1DCCB"/></g>`,
      // olive fatigues, boots, and a plate carrier with two pouches. The helmet is part of the head picture.
      todd:()=>legs('#687644','#3A3324')+arms('#687644')+torso('#687644')+`<path d="M-11 -46L-12.5 -22H12.5L11 -46H6.5Q0 -40 -6.5 -46Z" fill="#4A5630"/><g fill="#3E4928"><rect x="-10" y="-31" width="8.5" height="8" rx="1.5"/><rect x="1.5" y="-31" width="8.5" height="8" rx="1.5"/></g><path d="M-9 -36H9" stroke="#3E4928" stroke-width="1.6"/>`,
    }[id]();
    // the head: big, and overlapping the collar. Jack's is longer, so the beard runs down his shirt.
    const hh=id==='jack'?70:60,hw=w168*hh/168,top=-103,x=-hw/2,s=hh/168;
    const eye=(ex,ey)=>`<g transform="translate(${(x+ex*s).toFixed(1)} ${(top+ey*s).toFixed(1)})"><circle r="4.6" fill="#FF2A2A" opacity=".35"/><path d="M-9 0H9M0 -3.5V3.5" stroke="#FF4B4B" stroke-width="1.1" stroke-linecap="round"/><circle r="2.6" fill="#FF2A2A"/><circle r="1.1" fill="#FFE3E3"/></g>`;
    return body+`<g class="maphead"><image href="${file}" x="${x.toFixed(1)}" y="${top}" width="${hw.toFixed(1)}" height="${hh}"/>`+(id==='saylor'?`<g class="maplaser">${eye(49,92)}${eye(78,92)}</g>`:'')+'</g>';
  }
  // Whoever you play as also drives the car on the landing: their head and shoulders, and the colours of their arms.
  // The landing shows this same island from the road, so it borrows the buildings exactly as they are drawn here,
  // each with the middle of its floor at (0,0). The company comes with the small island it stands on.
  const islet=(x,y)=>`<ellipse cx="${x}" cy="${y+16}" rx="96" ry="48" fill="#1B8E77"/><ellipse cx="${x}" cy="${y+8}" rx="96" ry="48" fill="#E9DDB0"/><ellipse cx="${x}" cy="${y+6}" rx="88" ry="42" fill="#7ED6A0"/>`;
  const landmark=id=>id==='company'?islet(0,0)+building(0,0,COMPANY.b).svg:building(0,0,SPOTS[id].b).svg;
  const driver=()=>({svg:figure(WHO,0,1),sleeve:CHARS[WHO].sleeve||CHARS[WHO].skin,skin:CHARS[WHO].skin,quote:CHARS[WHO].quote});

  // Places (and you) can be clicked too. They open a card with nothing but a name and a joke: see SPOT_JOKES.
  // The attributes go on the place's group; a <title> can't, so the name is the label for screen readers.
  const spot=(id,name)=>{REG.push({spot:id,name});return `class="maptap mapplace" data-i="${REG.length-1}" role="button" aria-label="${name}"`};
  // Every disaster is a target plus one of six effects. The target is where it strikes: a place, you, the cloud, the
  // company across the water, the things it reaches, or (for time passing) the whole island.
  function effectKind(){
    const e=FX.ev,theft=FX.kind==='t';
    if(e.id==='l_time'||e.lapse)return 'time';
    if(e.places&&e.places.length)return theft?'thief':e.fire?'fire':e.places[0]==='bank'?'lock':'poof'; // stolen, burned, shut away, mislaid
    if(theft)return e.cust&&!e.login&&e.id!=='c_hack'?'lock':'bolt';                                  // freezes and seizures lock; hacks strike
    return e.cloud||e.prov||e.gov?'lock':'poof';                                                      // locked out; or it just stops existing
  }
  function target(spots){
    const e=FX.ev,you={x:YOU.x,top:YOU.y-106,front:YOU.y-18,you:1};
    if(e.places&&e.places.length){const p=e.places.find(p=>p!=='carry'&&!e.duress);return p?spots[p]:you}
    if(e.cloud)return {x:124,top:20,front:104};
    if(e.prov||e.gov||(e.cust&&!e.login))return spots.company;
    if(e.login||e.phish)return you;
    if(e.id==='l_time')return {x:350,top:210,front:300};
    const t=REG.find(t=>t.fresh&&t.fate!=='safe')||REG.find(t=>t.fresh); // strikes things directly: aim at the first one it reaches
    return t?{x:t.x,top:t.y-112,front:t.y}:you;
  }
  // What happens there: the disaster's icon drops in, then the effect. Timing is in the CSS (.fx…): drop, effect, then the things react.
  function effects(h){
    const flame=(x,y,s,d)=>`<g transform="translate(${h.x+x} ${y}) scale(${s})"><g class="fxflame" style="--t:${d}s"><path d="M0 0C-17 -9 -15 -30 -5 -44C-4 -34 3 -32 4 -24C10 -30 9 -40 6 -50C20 -38 22 -14 0 0Z" fill="#FF7A1A"/><path d="M0 -2C-9 -7 -8 -19 -2 -27C-1 -21 3 -20 4 -15C10 -20 11 -8 0 -2Z" fill="#FFD84D"/></g></g>`;

  /* The Build screen is a building site: a crane beside you with its hook over your head, a sign and two cones, and a

  const HI='#FFC533';

      (co?row(c.x-58,c.y+52,co.items,co.name)+`<path d="M${YOU.x+70} ${YOU.y-50}Q520 60 ${c.x-96} ${c.y+30}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round" opacity=".9"/>`:'')+

  /* The introduction: the map builds itself in a few beats, each with a short caption. Worded as "let's say", because
     this is a pretend starting point and not a claim about the player. With many things, they all arrive in one beat. */
  const SAY={phone:'you have a bitcoin wallet on your phone',laptop:'you have a bitcoin wallet on your laptop',signer:'your key is on a hardware signer',login:'all you hold is a login',coins:'your coins are with a company',key:'a company holds one key',paper:'you wrote down the 12-word recovery phrase on a piece of paper',steel:'you stamped the 12-word recovery phrase into steel',note:'your passphrase is written down',file:'there is a copy of the wallet file'};
  const AT={'Home':' at home','Relative’s place':' at a relative’s place','Office':' at the office','Friend’s place':' at a friend’s place','Bank box':' in a bank box','Cloud':' in the cloud'};
  const ORDER=['coins','phone','laptop','signer','key','login','paper','steel','note','file'];
  // lead: a sentence about the setup's risk, said just before the disaster button is introduced (ui.js writes it).
  function beats(lead){
    const things=REG.map((t,i)=>({t,i})).filter(x=>x.t.t).sort((a,b)=>ORDER.indexOf(a.t.t)-ORDER.indexOf(b.t.t));
    const out=[{steps:['you'],text:'This is you. Tap yourself to be someone else.'}];
    if(things.length>3)out.push({steps:things.map(x=>'t'+x.i),text:'Let’s say this is your setup.'});
    else things.forEach((x,n)=>out.push({steps:['t'+x.i],text:(n?'And ':'Let’s say ')+SAY[x.t.t]+(AT[x.t.place]||'')+'.'}));

    // straight after the device; with no PIN it comes last.
    const head=(REG.find(t=>t.head)||{}).head;
    if(head){
      const pin=head.find(l=>/unlock PIN/.test(l.label)),one=pin||head[0],lower=l=>l.label[0].toLowerCase()+l.label.slice(1);
      const beat={steps:['head'],text:pin||head.length===1?`And your ${lower(one)} is memorized.`:'And some things are memorized.'};

    out.push({steps:[],point:'.maptool.next',text:'🚀 When you’re ready, press “Improve it” to build a better one.'});

  }

  /* the card that opens when you click a thing. It says what the thing is, never what could go wrong with it. */
  /* Two seed phrases, never picked at random: the first time a seed is opened it is always the Rickroll, the second

  const SEEDS=[['never','gonna','give','you','up','never','gonna','let','you','down','never','gonna'],[...Array(11).fill('abandon'),'about']];

    home:['Home sweet home. The dishes can wait.','There’s a drawer in here full of cables you will never use.','The Wi-Fi password is on the fridge.'],

  document.addEventListener('click',ev=>{

  // beats() and things() describe the map drawn by the latest svg() call. things() lists what is on it and what became of each.

  const things=()=>REG.map((t,i)=>({id:t.id,role:t.role,k:t.k,fate:t.fate,fresh:t.fresh,t:t.t,i,x:t.x,y:t.y,loc:t.loc})).filter(t=>t.t);

  /* The last screen: the island with nothing kept on it, and everybody you can play as dancing along its front edge,
     whoever you are playing in the middle. Three dance moves and a few floating notes; the movement is all in the CSS
     (.dancer, .partynote). The view is shifted so the island, not the drawing, is in the middle. */
  function party(){
    const B=Object.values(SPOTS).map(p=>[p.y,building(p.x,p.y,p.b).svg]).sort((a,b)=>a[0]-b[0]).map(b=>b[1]).join('');
    const ids=Object.keys(CHARS).filter(id=>id!==WHO);ids.splice(ids.length>>1,0,WHO);
    const at=i=>{const x=350+(i-(ids.length-1)/2)*56;return[x,302+192*Math.sqrt(1-((x-350)/308)**2)-42]};
    const dancers=ids.map((id,i)=>[i,...at(i),id]).sort((a,b)=>a[2]-b[2]).map(([i,x,y,id])=>
      `<g transform="translate(${x} ${y.toFixed(1)})"><ellipse cy="2" rx="24" ry="8" fill="#000" opacity=".18"/><g class="dancer d${i%3}" style="--t:${(-i*.17).toFixed(2)}s"><title>${CHARS[id].name}</title>${figure(id,0)}</g></g>`).join('');
    const notes=[[150,250,'♪'],[250,300,'♫'],[352,286,'♪'],[452,300,'♫'],[556,252,'♪'],[306,340,'🎉'],[404,344,'🎉']].map(([x,y,n],i)=>
      `<text class="partynote" style="--t:${(-i*.37).toFixed(2)}s" x="${x}" y="${y}" text-anchor="middle" font-size="${n==='🎉'?30:34}" font-weight="800" fill="#fff" stroke="#1B1840" stroke-width="1.5">${n}</text>`).join('');
    return `<svg class="partymap" viewBox="-50 0 800 560" role="img" aria-label="Everybody dancing on the island">
